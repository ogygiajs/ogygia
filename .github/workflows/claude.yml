name: Claude

# `@claude` in an issue, a PR comment or a review asks Claude to answer, fix or build it. Runs on the
# maintainer's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN) and answers through the Claude GitHub
# App. The action only acts for commenters with write access to the repository, so on this public
# repo nobody else can spend the subscription.
on:
  # (comment triggers are the point here; the action acts only for commenters with write access)
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # the action trades it for the Claude GitHub App's token, which it answers and pushes with
      id-token: write
      # to read CI results on a PR
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # an explicit tool list: edits, reads, the repo's own scripts and read-only gh/git
          claude_args: |
            --allowedTools "Edit,MultiEdit,Write,Read,Grep,Glob,LS,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(pnpm install:*),Bash(pnpm run:*),Bash(pnpm --filter:*),Bash(pnpm exec vitest:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*)"
