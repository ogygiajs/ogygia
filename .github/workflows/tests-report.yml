name: tests report

# THE RELEASED VERSION'S TESTS REPORT, for the docs' tests page. When a release of `ogygia` is
# published (release.yml's changesets publish makes the GitHub release), this runs every package's
# unit and browser tests at the released commit in Chromium, Firefox and WebKit (Chromium with
# coverage), reads that commit's e2e results from its own main runs (e2e.yml and engines.yml upload
# them), and writes `apps/docs/static/tests/<version>/` (.github/scripts/test-report.ts).
#
# It reaches the site through main, like any docs change: it opens a PR from
# `chore/tests-report-<version>` with only those files (e2e.yml's plan fails it otherwise,
# .github/scripts/tests-report-only.ts), labels it `ship`, and ship.yml merges it once `ci ok`
# passes; the release workflow then moves `latest` to main as it does after any merge with nothing
# pending. A red `ci ok` is run again once; still red, an issue says so. Never part of `ci ok`.
#
# A manual run (workflow_dispatch) makes the report for a version already released.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'the ogygia version to report (its tag ogygia@<version> must exist)'
        required: true

permissions: {}

jobs:
  report:
    # (one release per package: only ogygia's own starts the report)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ogygia@')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: tests-report-${{ inputs.version || github.event.release.tag_name }}
    # SHIP_TOKEN (contents + pull requests) pushes the branch, opens the PR and adds `ship`, so CI and
    # ship.yml run on them (GITHUB_TOKEN's events start no workflow); GITHUB_TOKEN reruns a red run
    # and opens the issue, which SHIP_TOKEN may not. Each token is given only to the steps that call
    # gh: the install, build and test steps run the released commit's code and its dependencies.
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - name: The version and its commit
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-${TAG#ogygia@}}"
          # (the version reaches shell scripts that hold SHIP_TOKEN: only a semver passes)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version: $version"
            exit 1
          fi
          sha=$(gh api "repos/$REPO/commits/ogygia@$version" --jq .sha)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ogygia $version at $sha"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # that commit's e2e results, from its own runs on main (Chromium in e2e.yml, Firefox and
      # WebKit in engines.yml): waited for, at most two hours, then read as they are
      - name: The released commit's e2e results
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          mkdir -p .e2e
          for wf in e2e.yml engines.yml; do
            for i in $(seq 1 120); do
              run=$(gh run list --repo "$REPO" --workflow "$wf" --commit "$SHA" --limit 1 --json databaseId,status --jq '.[0]')
              status=$(echo "$run" | jq -r '.status // "none"')
              [ "$status" = "completed" ] || [ "$status" = "none" ] && break
              sleep 60
            done
            id=$(echo "$run" | jq -r '.databaseId // empty')
            if [ -n "$id" ]; then
              gh run download "$id" --repo "$REPO" --pattern 'e2e-results-*' --dir ".e2e/$wf" || echo "::warning::no e2e results in $wf run $id"
            else
              echo "::warning::no $wf run for $SHA: the report has no e2e from it"
            fi
          done

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # (no shared dependency cache: the release's report installs fresh)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib
      - name: Install Playwright's engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run every package's tests, all engines
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          node .github/scripts/test-report.ts --out "$RUNNER_TEMP/tests/$VERSION" \
            --raw "$RUNNER_TEMP/raw" --engines chromium,firefox,webkit --e2e .e2e \
            --version "$VERSION" --commit "$SHA"

      # (the per-file coverage and lcov stay here, never in the repo)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-report-${{ steps.v.outputs.version }}
          path: |
            ${{ runner.temp }}/tests/
            ${{ runner.temp }}/raw/
          retention-days: 90

      # main's tree, with the report added: the report's files and the index, nothing else
      - name: Open the report PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SHIP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # (a branch of its own per run: an earlier run's PR is closed, never pushed over)
          branch="chore/tests-report-$VERSION-$RUN_ID"
          for old in $(gh pr list --repo "$REPO" --state open --json number,headRefName --jq ".[]|select(.headRefName|startswith(\"chore/tests-report-$VERSION-\"))|.number"); do
            gh pr close "$old" --repo "$REPO" --delete-branch --comment "Replaced by a newer report run." || true # ok: one already closed by hand
          done
          git fetch origin main
          git checkout -B "$branch" origin/main
          dest="apps/docs/static/tests/$VERSION"
          rm -rf "$dest" && mkdir -p "$dest"
          for f in "$RUNNER_TEMP/tests/$VERSION"/*.json; do cp "$f" "$dest/"; done
          node .github/scripts/test-report.ts --out "$dest" --version "$VERSION" --index-only
          git add apps/docs/static/tests
          if git diff --cached --quiet; then echo "nothing new for $VERSION"; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name='ogygia tests report' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "chore(tests): $VERSION test report"
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "$branch"
          url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "chore(tests): $VERSION test report" \
            --body "The tests report for ogygia $VERSION (its unit, browser and e2e results and its coverage) for the docs' tests page, made by the tests-report workflow at the released commit $SHA. Only \`apps/docs/static/tests/**\`: e2e.yml's plan enforces it. Merges itself once \`ci ok\` passes.")
          number="${url##*/}"
          gh pr edit "$number" --repo "$REPO" --add-label ship
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # never silent: a red `ci ok` runs again once, then an issue says so
      - name: See it merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.v.outputs.version }}
          RERUN_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for attempt in 1 2; do
            sleep 60
            if gh pr checks "$PR" --repo "$REPO" --required --watch --interval 60; then
              for i in $(seq 1 30); do
                [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" = "MERGED" ] && exit 0
                sleep 60
              done
              break
            fi
            [ "$attempt" = 2 ] && break
            head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
            for id in $(gh run list --repo "$REPO" --commit "$head" --json databaseId,conclusion --jq '.[]|select(.conclusion=="failure")|.databaseId'); do
              GH_TOKEN="$RERUN_TOKEN" gh run rerun "$id" --repo "$REPO" --failed || true # ok: a run that cannot be rerun leaves the second watch to say so
            done
          done
          GH_TOKEN="$RERUN_TOKEN" gh issue create --repo "$REPO" \
            --title "tests report $VERSION did not merge" \
            --body "The tests-report PR #$PR for ogygia $VERSION did not merge: its required checks failed twice (once rerun), or it was not merged within half an hour of passing. The site keeps the previous report until it lands. Run: $RUN_URL"
          exit 1
