name: abax

# Asks ogygiajs/bench for an Abax run the moment a PR is opened or pushed: Abax counts the steps of
# the bench files (packages/*/bench) on the PR's commit and on its base, from source, so it needs no
# pkg.pr.new preview and does not wait for one (pkg-pr-new.yml asks for the app benchmark once the
# preview is published). Abax's section comes first in the PR's one benchmark comment.
#
# A push to main needs nothing here: the `ogygia-main` request pkg-pr-new.yml sends after the
# publish runs Abax over every bench file too. Forks, drafts and version PRs are skipped, like the
# app benchmark. This never fails: without BENCH_TOKEN it skips with a notice, and a refused request
# only warns.

on:
  pull_request:
    # ready_for_review: a draft gets no run, so one starts when it leaves draft
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  request:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request an Abax run
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BENCH_TOKEN is not set, so no Abax run was requested"
            exit 0
          fi
          gh api repos/ogygiajs/bench/dispatches -f event_type=ogygia-abax \
            -F "client_payload[pr]=$PR" -f "client_payload[sha]=$HEAD_SHA" \
            -f "client_payload[base_sha]=$BASE_SHA" ||
            echo "::warning::ogygiajs/bench refused the Abax request (check BENCH_TOKEN)"
