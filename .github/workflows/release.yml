name: Changesets

# main is the development line (.changeset/README.md): a merged changeset opens or updates the
# version PR; merging that PR publishes to npm under `latest`. The production sites (ogygiajs.dev,
# svelte.dev.ogygiajs.dev) deploy from the `latest` branch, which this workflow moves to main
# whenever main has nothing waiting to release: right after a publish, and after any merge that
# leaves no pending changeset (a docs or site change goes live by itself; while a package change
# waits for its release, so does the site, so it never documents what npm does not have).
on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # all history, so changesets can link each changelog entry to its commit and PR
          fetch-depth: 0
          # SHIP_TOKEN (a fine-grained token, not GITHUB_TOKEN): the version PR it opens and pushes
          # then runs CI like any PR, so the `ship` label can merge it
          token: ${{ secrets.SHIP_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm run build:lib
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:release
          commit-message: 'chore: update versions (${{ github.ref_name }})'
          pr-title: 'chore: update versions (${{ github.ref_name }})'
          create-github-releases: true
          # the action refuses a GITHUB_TOKEN env that differs from this input
          github-token: ${{ secrets.SHIP_TOKEN || github.token }}
      # main matches npm: just published, or no changeset is pending. A fast-forward only: latest
      # is only ever set from main, so a refused push means someone moved it by hand.
      - name: Move the latest branch to main
        if: steps.changesets.outputs.published == 'true' || steps.changesets.outputs.hasChangesets == 'false'
        run: git push origin HEAD:refs/heads/latest
