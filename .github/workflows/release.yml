name: Changesets

# main is the development line (.changeset/README.md): a merged changeset opens or updates the
# version PR; merging that PR publishes to npm under `latest`, and only then moves the `latest`
# branch to the released commit. The production sites (ogygiajs.dev, svelte.dev.ogygiajs.dev)
# deploy from the `latest` branch, so they change on a release, never on a merge.
on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # all history, so changesets can link each changelog entry to its commit and PR
          fetch-depth: 0
          # SHIP_TOKEN (a fine-grained token, not GITHUB_TOKEN): the version PR it opens and pushes
          # then runs CI like any PR, so the `ship` label can merge it
          token: ${{ secrets.SHIP_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm run build:lib
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:release
          commit-message: 'chore: update versions (${{ github.ref_name }})'
          pr-title: 'chore: update versions (${{ github.ref_name }})'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.SHIP_TOKEN || github.token }}
      # only once npm accepted the release: the sites deploy what was just published
      - name: Move the latest branch to the release
        if: steps.changesets.outputs.published == 'true'
        run: git push --force origin HEAD:refs/heads/latest
