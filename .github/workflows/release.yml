name: Changesets

on:
  push:
    branches:
      - lts-0.8

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # all history, so changesets can link each changelog entry to its commit and PR
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm run build:lib
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm ci:version
          # lts-0.8 is the 0.8.x line: `latest` belongs to main (0.11+), so a patch here publishes
          # under the npm tag `lts-0.8` (npm refuses a tag that reads as a version range, like `0.8`)
          publish-script: pnpm ci:release --tag lts-0.8
          commit-message: 'chore: update versions (lts-0.8)'
          pr-title: 'chore: update versions (lts-0.8)'
          create-github-releases: true
