name: Changesets

# lts-0.12 is the 0.12.x line, kept for patches (.changeset/README.md): a merged changeset opens or
# updates the version PR; merging that PR publishes to npm under the tag `lts-0.12`. `latest` (the
# npm tag and the branch the sites deploy from) belongs to main, so this workflow never touches it.
# (npm refuses a tag that reads as a version range, like `0.12`.)
on:
  push:
    branches:
      - lts-0.12

# turbo's remote cache (see e2e.yml): build:lib replays what CI already built for this commit
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # all history, so changesets can link each changelog entry to its commit and PR
          fetch-depth: 0
          # SHIP_TOKEN (a fine-grained token, not GITHUB_TOKEN): the version PR it opens and pushes
          # then runs CI like any PR
          token: ${{ secrets.SHIP_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm run build:lib
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:release --tag lts-0.12
          commit-message: 'chore: update versions (${{ github.ref_name }})'
          pr-title: 'chore: update versions (${{ github.ref_name }})'
          create-github-releases: true
          # the action refuses a GITHUB_TOKEN env that differs from this input
          github-token: ${{ secrets.SHIP_TOKEN || github.token }}
