name: engines

# FIREFOX AND WEBKIT: the e2e slices and the browser test projects in the engines beside Chromium
# (e2e.yml runs Chromium on every push). They run on a push to main, every night, on a manual run,
# and on a pull request that carries or earns `ci:engines` (or `ci:full`, .github/scripts/ci-labels.ts):
# adding the label starts them at once, and later pushes follow the labels. They report and do not
# block: Firefox and WebKit join `ci ok` once #392 and the engine flakes are fixed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'

# (a pull request reads the cache and never writes it: only main's runs fill it)
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name != 'push' }}

# (a push cancels the PR's older run; adding another label does not)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

# read-only by default; a job that needs more says so
permissions:
  contents: read

jobs:
  # Whether this run is wanted: always off a pull request; on one, when it carries or earns the
  # label (a label event for any other label starts nothing). The version PR runs none.
  gate:
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') && (github.event.action != 'labeled' ||
      github.event.label.name == 'ci:engines' || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || node .github/scripts/ci-labels.ts --has ci:engines; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      browsers: ${{ steps.plan.outputs.browsers }}
      e2e_engines: ${{ steps.plan.outputs.e2e_engines }}
      browsers_hash: ${{ steps.plan.outputs.browsers_hash }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Plan
        id: plan
        run: node .github/scripts/ci-plan.ts
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}

  # The e2e slices in Firefox and WebKit. Playwright's WebKit is the engine behind Safari, not Safari.
  e2e-engines:
    name: e2e (${{ matrix.name }}, ${{ matrix.browser }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.e2e_engines != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_engines) }}
    uses: ./.github/workflows/e2e-slice.yml # zizmor: ignore[self-repository]
    with:
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      filter: ${{ matrix.filter }}
      shard: ${{ matrix.shard }}
      adapters: ${{ matrix.adapters }}
      browser: ${{ matrix.browser }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # The browser test projects (core, content, machine) in the engines beside Chromium (which e2e.yml's
  # `check` runs): Playwright's Firefox and WebKit, and Firefox as released (WebdriverIO and
  # geckodriver: Playwright's Firefox build can lag the release, and #382 showed in the release). They
  # run vitest directly (no turbo task to replay), so they always set up.
  browsers:
    name: browsers (${{ matrix.browser }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.browsers != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        if: matrix.browser != 'firefox-stable'
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        if: matrix.browser != 'firefox-stable'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # WebKit needs system libraries the runner image lacks: --with-deps here
      - name: Install Playwright ${{ matrix.browser }}
        if: matrix.browser != 'firefox-stable'
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps "$BROWSER"

      # the released Firefox (the runner's own is replaced by the latest release); geckodriver is
      # fetched by webdriverio when the run starts
      - name: Install Firefox (release)
        if: matrix.browser == 'firefox-stable'
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest

      - name: Build the libraries
        run: pnpm run build:lib

      - name: Browser tests (core, content, machine)
        run: |
          for pkg in machine content core; do
            echo "::group::$pkg"
            (cd packages/$pkg && pnpm exec vitest run --project browser) || failed=1
            echo "::endgroup::"
          done
          exit ${failed:-0}
        env:
          OGYGIA_BROWSERS: ${{ matrix.browser }}
          OGYGIA_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}

      # remembered: the same inputs in this engine passed (the plan leaves the job out next time)
      - name: Remember the pass
        run: echo "${{ needs.plan.outputs.browsers_hash }}" > .browsers-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .browsers-pass
          key: browsers-pass-${{ matrix.browser }}-${{ needs.plan.outputs.browsers_hash }}
