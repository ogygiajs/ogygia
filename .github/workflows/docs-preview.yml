name: docs preview

# A pull request's docs preview deploys only when someone approves it. Vercel's own git deploys
# stay automatic for `latest` (the production site), `main`, and the version PRs
# (`changeset-release/*`), and are off for every other branch (apps/docs/vercel.json). A pull
# request push that touches the docs or the packages queues one run here. The run waits on the
# `docs-preview` environment's reviewer, and approving it ("Review deployments" on the run) deploys
# that commit as a Vercel preview and comments the URL on the PR. A newer push cancels the waiting
# run, so approval is always for the latest commit. Run it by hand (workflow_dispatch) for any branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - package.json
      - 'pnpm-*.yaml'
      - turbo.json
      - .github/workflows/docs-preview.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_VlDB4cJNm6LY3GNwSpl8A6Jf
  VERCEL_PROJECT_ID: prj_YrsaVgPKKR92gmEnQZmjUOF3QGk0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  deploy:
    # a version PR has nothing new to show; a fork's PR gets no secrets
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft
      && !startsWith(github.head_ref, 'changeset-release/')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      # the Vercel project's own Node version, so the preview builds as production does
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Vercel project settings
        run: pnpm dlx vercel@65.12.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: pnpm dlx vercel@65.12.1 build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url="$(pnpm dlx vercel@65.12.1 deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment the URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Docs preview for ${SHA:0:8}: $URL"
          gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" \
            --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body "$body"
