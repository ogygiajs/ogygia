name: upstream-watch

# Periodically pull the LATEST svelte and the latest @sveltejs/kit of EACH supported major, and run
# the whole suite against them, so an upstream change that breaks ogygia is caught here — with a
# filed issue — instead of by a user. This never touches a branch: it bumps versions in a throwaway
# checkout and reports.

on:
  schedule:
    # Mondays 06:00 UTC. Weekly is enough to catch a regression while it's still fresh upstream.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Upstream's breakage, in the one engine this workflow installs (Chromium); the others are e2e.yml's.
env:
  OGYGIA_BROWSERS: chromium

jobs:
  upstream:
    name: upstream (SvelteKit ${{ matrix.kit }} on ${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # one red line must not cancel the other: both verdicts in one run
      fail-fast: false
      matrix:
        include:
          # main supports SvelteKit 2 AND 3: both. `^2` takes the newest 2.x, never a 3.
          - { kit: 2, ref: main, kit_spec: '^2' }
          - { kit: 3, ref: main, kit_spec: 'latest' }
          # kit3 is the SvelteKit-3-only line (#133)
          - { kit: 3, ref: kit3, kit_spec: 'latest' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22: adapter-vercel rejects unpinned bleeding-edge Node; 22 is a supported runtime.
          node-version: 22
          cache: pnpm

      # Bun runtime dimension — the adapter e2e suite runs the node-server output under bun too.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install workspace deps (baseline lockfile)
        run: pnpm install --frozen-lockfile

      # Playwright before the baseline: the baseline runs the browser project too. Cached per
      # Playwright version, no `--with-deps` (the runner image has the libraries) — as in e2e.yml.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      # BASELINE — the same unit + browser suites the upstream leg runs, on the versions the
      # lockfile PINS. A failure here is suite rot or a flake in this repo, NOT upstream, and the
      # report says so instead of blaming the latest svelte/kit. (This watcher filed "upstream
      # break" twice for a browser test that failed on the pinned versions just the same — a
      # pointer resting over the fixture on the runner.) `continue-on-error` keeps the upstream
      # leg running; the verdict rides in BASELINE for the report step.
      # The libraries are built first: the unit suites import `dist/` (without it 21 files failed to
      # load, and every run was filed as "suite red").
      - name: Baseline — unit + browser suites on the PINNED lockfile
        id: baseline
        continue-on-error: true
        run: |
          pnpm run build:lib
          pnpm -C packages/core test

      - name: Record the baseline verdict
        run: echo "BASELINE=${{ steps.baseline.outcome }}" >> "$GITHUB_ENV"

      - name: Bump svelte to latest and @sveltejs/kit to the latest ${{ matrix.kit }}.x across the workspace
        run: |
          # Runs in every workspace package that depends on them (docs, the test apps, fixture apps,
          # lib devDeps); the specs ignore each package's own range.
          pnpm -r update svelte@latest "@sveltejs/kit@${{ matrix.kit_spec }}"
          # Record the resolved versions the apps actually build against, for the failure report.
          {
            echo "SVELTE_VERSION=$(node -p "require('./apps/docs/node_modules/svelte/package.json').version")"
            echo "KIT_VERSION=$(node -p "require('./apps/docs/node_modules/@sveltejs/kit/package.json').version")"
          } >> "$GITHUB_ENV"

      - name: Show the versions under test
        run: |
          echo "svelte      = ${SVELTE_VERSION}"
          echo "@sveltejs/kit = ${KIT_VERSION}"

      # wrangler (Cloudflare workerd) is fetched on demand by the suite via npx; warm it so the
      # cloudflare adapter boots the real Workers runtime instead of skipping.
      - name: Warm wrangler
        run: npx --yes wrangler --version

      # Two tasks at a time, as in e2e.yml: turbo's default ten at once on this 4-core runner starves
      # every package's vitest pool, and the slow first tests (shiki's highlighter warm-up) time out
      # as a false "upstream break" (#127).
      - name: Type-check + unit tests (build:lib, every package's check)
        run: pnpm run check --concurrency=2

      # every suite, none replayed from the cache: the point is the new upstream
      - name: Full e2e suite (every package's; adapters on node + bun)
        run: pnpm turbo run e2e --concurrency=1 --force
        env:
          OGYGIA_E2E_WRANGLER: '1'
          # Stable CI-only signing key so the warn-path probe's production build is silent (locally
          # this comes from apps/palaestra/.env, which is gitignored). Mirrors e2e.yml — without it
          # the probe's "stable secret → no warning" assertion fails on every scheduled run. NOT a
          # production secret; the Vercel deploy sets its own OGYGIA_SECRET.
          OGYGIA_SECRET: 3f9a2b7c1e5d8046af62c93b1d7e4058a6c2f19b3e8d70425c9a1f6b8d3e07c4

      # ── Report ─────────────────────────────────────────────────────────────────────────────────
      # On failure, open (or comment on) a tracking issue so a green upstream never spams and a broken
      # one is loud. De-duped per verdict label (`upstream-break` / `suite-red`) AND per Kit line.
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE: SvelteKit ${{ matrix.kit }} on ${{ matrix.ref }}
          REF: ${{ matrix.ref }}
          KIT_SPEC: ${{ matrix.kit_spec }}
        run: |
          set -euo pipefail
          # The baseline leg decides what this failure IS. Red on the pinned lockfile too → the repo's
          # own suite is rot/flaky and upstream is not implicated: file it under `suite-red`, never
          # as an upstream break. Green baseline + red upstream leg → a real upstream change.
          if [ "${BASELINE:-}" = "failure" ]; then
            LABEL=suite-red
            TITLE="[${LINE}] suite red on PINNED versions (not upstream) — run of $(date -u +%Y-%m-%d)"
            VERDICT='The **baseline** leg (the same unit + browser suites on the PINNED lockfile) failed in this same run. This is suite rot or a flake in this repo — the latest `svelte` / `@sveltejs/kit` are **not** implicated. Fix the suite.'
          else
            LABEL=upstream-break
            TITLE="[${LINE}] upstream break: svelte ${SVELTE_VERSION:-?} / @sveltejs/kit ${KIT_VERSION:-?}"
            VERDICT='The baseline leg (same suites on the pinned lockfile) **passed** in this run, so the failure is specific to the bumped versions — something changed upstream.'
          fi
          # Build the body without a heredoc (YAML-safe) and write it to a file for --body-file.
          {
            printf 'The scheduled **upstream-watch** run failed for **%s** (branch `%s`) against the latest published upstream:\n\n' "${LINE}" "${REF}"
            printf -- '- `svelte` = `%s`\n' "${SVELTE_VERSION:-unknown}"
            printf -- '- `@sveltejs/kit` = `%s`\n' "${KIT_VERSION:-unknown}"
            printf -- '- baseline (pinned lockfile) = `%s`\n\n' "${BASELINE:-unknown}"
            printf '%s\n\n' "${VERDICT}"
            printf 'Reproduce locally, on `%s`:\n\n' "${REF}"
            printf '%s\n' '```sh'
            printf 'pnpm -r update svelte@latest "@sveltejs/kit@%s"\n' "${KIT_SPEC}"
            printf '%s\n' 'pnpm run check && pnpm turbo run e2e --concurrency=1 --force'
            printf '%s\n\n' '```'
            printf 'Failing run: %s\n' "${RUN_URL}"
          } > /tmp/upstream-issue.md
          # One open tracking issue PER VERDICT AND LINE at a time: comment if it exists, else create
          # it. A flake must not pile onto a real upstream thread, nor Kit 2 onto Kit 3.
          EXISTING=$(gh issue list --state open --label "${LABEL}" --json number,title \
            --jq "[.[] | select(.title | startswith(\"[${LINE}]\"))][0].number // empty" || echo "")
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file /tmp/upstream-issue.md
          else
            if [ "${LABEL}" = "suite-red" ]; then
              gh label create suite-red --color d93f0b --description "Suite red on the PINNED lockfile (rot/flake, not upstream)" 2>/dev/null || true
            else
              gh label create upstream-break --color b60205 --description "Suite red against latest svelte/kit" 2>/dev/null || true
            fi
            gh issue create --title "${TITLE}" --body-file /tmp/upstream-issue.md --label "${LABEL}"
          fi

      # A green line closes its open tracking issues (either verdict): the thread ends where it was
      # proven fixed, instead of staying open until someone remembers it.
      - name: Close this line's issues when it is green
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE: SvelteKit ${{ matrix.kit }} on ${{ matrix.ref }}
        run: |
          set -euo pipefail
          for LABEL in upstream-break suite-red; do
            for N in $(gh issue list --state open --label "${LABEL}" --json number,title \
              --jq ".[] | select(.title | startswith(\"[${LINE}]\")) | .number"); do
              gh issue close "${N}" --comment "Green on svelte \`${SVELTE_VERSION:-?}\` / @sveltejs/kit \`${KIT_VERSION:-?}\` in ${RUN_URL}."
            done
          done
