name: pkg.pr.new

# Publishes a continuous PREVIEW build of `ogygia` for every PR push and main, so a branch can be tested
# with `npm i https://pkg.pr.new/ogygiajs/ogygia@<sha-or-branch>` before anything hits npm.
# Requires the pkg.pr.new GitHub App installed on the repo: https://github.com/apps/pkg-pr-new
# Once published, it asks ogygiajs/bench to measure the build (the last step).

on:
  # main: the new benchmark baseline (and a preview of what was merged)
  push:
    branches: [main]
  # a pull request: once per push (a push to a PR's branch no longer publishes a second time), and
  # only when a published package's files (or what builds them) changed
  pull_request:
    # ready_for_review: a draft gets no benchmark run, so one starts when it leaves draft. A PR
    # publishes when it carries or earns `ci:preview` (or `ci:full`, .github/scripts/ci-labels.ts): a
    # PR into main earns it. Adding the label publishes at once.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'packages/ogygia/**'
      - 'packages/core/**'
      - 'packages/compiler/**'
      - 'packages/flags/**'
      - 'packages/barrels/**'
      - 'packages/bake/**'
      - 'packages/data-shake/**'
      - 'packages/postrender/**'
      - 'packages/federation/**'
      - 'packages/content/**'
      - 'packages/devtools/**'
      - 'packages/router/**'
      - 'packages/testing/**'
      - 'packages/cli/**'
      - 'packages/machine/**'
      - 'packages/insights/**'
      - 'packages/config/**'
      - 'packages/tsdown-plugin-svelte/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pkg-pr-new.yml'
  workflow_dispatch:

# turbo's remote cache (Vercel, the purus-projects team), shared with the e2e workflow
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  # (a pull request reads the cache and never writes it: only main's runs fill it)
  TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name != 'push' }}

permissions: {}

# A new push to a PR cancels that PR's older runs (branch pushes and manual runs never are)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:
  # Whether this run publishes: always off a pull request; on one, when it carries or earns
  # `ci:preview` (a label event for any other label publishes nothing). A version PR
  # (changeset-release/*) publishes for real once merged: no preview to try first.
  gate:
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') && (github.event.action != 'labeled' ||
      github.event.label.name == 'ci:preview' || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || node .github/scripts/ci-labels.ts --has ci:preview; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # (a fork's PR never publishes a preview: only this repository's branches do)
  publish:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the library to dist (the published preview uses publishConfig.exports → dist).
      - run: pnpm run build:lib

      # A preview names itself: the next patch as a prerelease of this commit (`0.8.3-next.cb18746`),
      # so a report or a lockfile never mistakes it for the release it was built after. Only the
      # packed copy changes — nothing is committed.
      # (a pull_request run checks out GitHub's merge commit: name the branch's own head instead)
      # Every published package gets the same preview version (they release as one fixed group).
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for dir in ogygia core compiler flags postrender data-shake federation content devtools router testing cli machine insights; do
            (cd packages/$dir && node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const [a,b,c]=p.version.split('-')[0].split('.').map(Number);p.version=a+'.'+b+'.'+(c+1)+'-next.'+process.env.HEAD_SHA.slice(0,7);fs.writeFileSync('package.json',JSON.stringify(p,null,'\t')+'\n');console.log(p.name+' '+p.version)")
          done

      # `--pnpm` makes pkg.pr.new pack with `pnpm pack` instead of the default `npm pack`. Only pnpm
      # pack applies `publishConfig` (swapping the dev `exports` that point at `src/` for the `dist/`
      # map). Without it the preview shipped raw source exports pointing at files not in the tarball,
      # so `import … from 'ogygia'` failed with ERR_RESOLVE_PACKAGE_ENTRY_FAIL.
      # `--packageManager=pnpm`: the PR comment's install line reads `pnpm add …`, not `npm i …`.
      # `ogygia` is a thin package over `@ogygia/core`, so both publish (one preview resolves the
      # other), with the plugin packages an app lists beside them.
      - run: >-
          npx --yes pkg-pr-new publish --pnpm --packageManager=pnpm
          './packages/ogygia' './packages/core' './packages/compiler' './packages/flags' './packages/postrender'
          './packages/federation' './packages/content' './packages/devtools' './packages/router'
          './packages/testing' './packages/cli' './packages/machine' './packages/barrels'
          './packages/insights' './packages/bake' './packages/data-shake'

      # Ask ogygiajs/bench to measure what was just published (it installs this commit's build
      # from pkg.pr.new). A PR commit is requested by the pull_request run only (the push run of the
      # same commit stays quiet, so nothing runs twice), and a push to main becomes the new baseline
      # (`ogygia-main` runs the app benchmark and Heisenbench; a PR's Heisenbench run is asked for by heisenbench.yml).
      # A PR asks only when it CARRIES `ci:bench` or `ci:full` (added by hand; earned labels do not count),
      # since ogygiajs/bench shares the org's runner pool.
      # Forks, drafts, comment sweeps and research/* are skipped, version PRs never get here (the job's `if`). This never fails
      # the job: without BENCH_TOKEN it skips with a notice, and a refused request only warns.
      - name: Request a benchmark run
        if: >-
          (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !startsWith(github.head_ref, 'chore/comments-') &&
          github.head_ref != 'chore/structured-comments' &&
          !startsWith(github.head_ref, 'research/') &&
          (contains(github.event.pull_request.labels.*.name, 'ci:bench') ||
          contains(github.event.pull_request.labels.*.name, 'ci:full'))) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BENCH_TOKEN is not set, so no benchmark run was requested"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            set -- -f event_type=ogygia-pr -F "client_payload[pr]=$PR" \
              -f "client_payload[sha]=$HEAD_SHA" -f "client_payload[base_sha]=$BASE_SHA" \
              -f "client_payload[head_ref]=$HEAD_REF"
          else
            set -- -f event_type=ogygia-main -f "client_payload[sha]=$HEAD_SHA"
          fi
          gh api repos/ogygiajs/bench/dispatches "$@" ||
            echo "::warning::ogygiajs/bench refused the benchmark request (check BENCH_TOKEN)"
