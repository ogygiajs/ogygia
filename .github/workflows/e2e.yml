name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # nightly: the released Firefox moves under us (`browsers (firefox-stable)` installs the latest)
  schedule:
    - cron: '30 21 * * *'

# A STAGED JOB GRAPH: the expensive jobs run only when needed, and only after the cheap ones pass.
#
#   plan ─┬─ check ─┬─ e2e (Chromium slices) ── e2e (Firefox and WebKit slices)
#         │         └─ browsers (Firefox, WebKit, released Firefox)
#         └─ size
#   ci ok: after all of them; THE required check
#
# `plan` asks turbo (`--dry=json`, `--affected` on a pull request) which tasks this push leaves to
# run (.github/scripts/ci-plan.ts): a job, or an e2e slice, with nothing to run is left out, and a
# push that changes only changesets, Markdown or other workflows runs nothing but `plan` and `ci ok`.
# Firefox and WebKit block `ci ok` like Chromium does; their e2e slices start once Chromium's pass.

# turbo's remote cache (Vercel, the purus-projects team): every runner, slice and machine shares one
# cache. Without the secret (a fork's PR) turbo falls back to the local cache restored in each job.
# A pull request reads the cache and never writes it: only main's runs fill it.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name != 'push' }}

# A new push to a PR cancels that PR's older runs (main, schedules and manual runs never are)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# read-only by default; a job that needs more says so
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      check: ${{ steps.plan.outputs.check }}
      browsers: ${{ steps.plan.outputs.browsers }}
      e2e_chromium: ${{ steps.plan.outputs.e2e_chromium }}
      e2e_engines: ${{ steps.plan.outputs.e2e_engines }}
      size: ${{ steps.plan.outputs.size }}
      browsers_hash: ${{ steps.plan.outputs.browsers_hash }}
      check_hash: ${{ steps.plan.outputs.check_hash }}
      size_hash: ${{ steps.plan.outputs.size_hash }}
      batched: ${{ steps.plan.outputs.batched }}
    # (reads the Actions cache list: a pass the browser and size jobs remembered)
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `--affected` and the path check diff against the base branch: they need the history
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # here, not in `check`: a PR that changes only a changeset runs no `check`
      - name: No major changeset below 1.0
        run: node .github/scripts/changeset-no-major.ts

      # a tests-report PR (the release workflow's own) carries the report and nothing else
      - name: A tests-report PR changes only the tests report
        if: startsWith(github.head_ref, 'chore/tests-report-')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/tests-report-only.ts "$BASE_SHA"

      - name: Every published package builds on publish
        run: node .github/scripts/publish-builds.ts

      # the workflows' own security lint; a finding is fixed, or ignored inline with its reason
      - name: Workflow security (zizmor)
        run: pipx run zizmor==1.32.0 --offline --min-severity low .github/workflows

      - name: Plan
        id: plan
        run: node .github/scripts/ci-plan.ts
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}

  check:
    needs: plan
    if: needs.plan.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the PR's merge commit and its first parent (the base branch's tip), for the comments gate
          fetch-depth: 2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22: adapter-vercel rejects unpinned bleeding-edge Node; 22 is a supported runtime.
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # first, and fast: an unformatted file fails here, not after the checks
      - name: Format check (oxfmt)
        run: pnpm run format:check

      - name: Lint rules' own tests
        run: pnpm run lint:test

      # a comment the PR adds in packages/*/src is one of structured-comments' shapes; old ones are
      # the #512 sweep's (internal/checks/new-comments.ts). A batch PR is judged against its base too.
      - name: No new unstructured comments
        if: github.event_name == 'pull_request'
        run: node internal/checks/new-comments.ts --base HEAD^1

      # a raw NUL byte hides a source file from grep and rg (internal/checks/nul-bytes.ts, #1239)
      - name: No NUL byte in source
        run: node internal/checks/nul-bytes.ts

      - name: CI scripts' own tests
        run: pnpm run ci:test

      # every step of every machine the packages define is reached by the simulator's sweep, taken
      # by a named real test, or dead and filed (internal/sim/steps.json): a new step in no bucket fails
      - name: Every machine step accounted for
        run: node internal/sim/src/steps.ts

      # every place in the packages' runtime and server source that can fail is fired by a buggify
      # point or a sim fault, covered by a named test, or impossible by a named rule or type
      # (internal/sim/failures.json): a new site in no bucket fails, and the baseline only shrinks
      - name: Every failure site accounted for
        run: node internal/sim/src/failures.ts ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}

      # What `check` would run, asked of turbo first: when every check task is a cache hit, nothing
      # runs a browser (a replay only prints the stored logs), so the browser's setup is skipped.
      - name: Plan
        id: plan
        run: |
          pnpm exec turbo run check --filter=./packages/* --filter=./packages/*/e2e/* --filter=./apps/* --filter=./internal/compiler-dst --dry=json > turbo-plan.json
          node -e '
            const plan = JSON.parse(require("fs").readFileSync("turbo-plan.json", "utf8"));
            const checks = (plan.tasks ?? []).filter((t) => t.task === "check" && t.command !== "<NONEXISTENT>");
            const left = checks.filter((t) => t.cache?.status !== "HIT");
            console.log(`${checks.length} check task(s), ${left.length} to run: ${left.map((t) => t.taskId).join(", ") || "none"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `skip=${left.length === 0}\n`);
          '
        env:
          OGYGIA_BROWSERS: chromium

      # core's vitest has a browser project.
      # Playwright's Chromium, cached per Playwright version: a hit downloads nothing. No `--with-deps`:
      # the runner image already has the browser's system libraries (it ships Google Chrome), and that
      # apt step is what stalled jobs. (Not the runner's Chrome itself: it fetches /favicon.ico on every
      # page, and the 404 trips the suites' "no console errors" checks.)
      - name: Playwright version
        if: steps.plan.outputs.skip != 'true'
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.plan.outputs.skip != 'true'
        run: pnpm exec playwright install chromium

      # Root `check` (build:lib + every package's check, every fixture app's and app's svelte-check
      # with warnings failing, each package's test and e2e tsc) — the e2e suites alone never run it,
      # which let type debt rot invisibly until upstream-watch tripped on it. Two tasks at a time:
      # every package's check runs its own vitest pool (core's with a browser), and turbo's default
      # ten at once on this 4-core runner starved them into timeouts.
      - name: Type-check (build:lib, every package's check)
        run: pnpm run check --concurrency=2
        # (the browser projects in Chromium here; the other engines in the `browsers` jobs)
        env:
          OGYGIA_BROWSERS: chromium

      # after the build: type-aware lint reads each Kit app's .svelte-kit/tsconfig.json, which
      # `svelte-kit sync` (internal/lint/kit-sync.ts) writes by loading the app's vite config, and that
      # imports the built libraries (ogygia/vite)
      - name: Lint (oxlint)
        run: pnpm run lint

      # the bench files (packages/*/bench, run by Heisenbench in ogygiajs/bench): their private-function
      # types written from Heisenbench at the ref internal/heisenbench pins, then type-checked like the tests are,
      # against the libraries the step above built
      - name: Type-check the bench files
        run: pnpm run check:bench

      # every library the check built (dist/, bundled dependencies included) turns no string into code
      - name: No eval in the built libraries
        run: node .github/scripts/built-no-eval.ts

      # every module-level Map / Set / growing array in packages/*/src is a cache(), owned by a
      # scope, or a marked fixed table (internal/checks/module-maps.ts, #414): its own tests, then the
      # scan, which fails on any finding (#413)
      - name: Module-level maps and sets
        run: pnpm run check:maps

      # each finding the simulator filed stays fixed (internal/sim test/found, #1702): the palaestra
      # built as dst.yml builds it (rules on), then the found tests against it (a gen-pinned one needs
      # its generated app and skips here)
      - name: Build the palaestra (rules on)
        working-directory: apps/palaestra
        env:
          OGYGIA_RULES: '1'
        run: node node_modules/vite/bin/vite.js build
      - name: The simulator's found tests
        working-directory: internal/sim
        run: node_modules/.bin/vitest run test/found

      # remembered: these inputs passed format, lint and every check (the plan leaves the job out next time)
      - name: Remember the pass
        run: echo "${{ needs.plan.outputs.check_hash }}" > .check-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .check-pass
          key: check-pass-${{ needs.plan.outputs.check_hash }}

  # The e2e slices the plan left to run, in Chromium first. (Chromium's jobs keep their slice names:
  # `e2e (core 1/3)`…)
  e2e-chromium:
    name: e2e (${{ matrix.name }})
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.e2e_chromium != '[]' && needs.check.result != 'failure' }}
    strategy:
      # one red slice must not cancel the others: the whole picture in one run
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_chromium) }}
    uses: ./.github/workflows/e2e-slice.yml # zizmor: ignore[self-repository]
    with:
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      filter: ${{ matrix.filter }}
      shard: ${{ matrix.shard }}
      adapters: ${{ matrix.adapters }}
      browser: ${{ matrix.browser }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # The e2e slices in Firefox and WebKit, once Chromium's passed (a red Chromium slice is fixed first,
  # so the runners are not spent on it twice). Playwright's WebKit is the engine behind Safari, not Safari.
  e2e-engines:
    name: e2e (${{ matrix.name }}, ${{ matrix.browser }})
    needs: [plan, check, e2e-chromium]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.e2e_engines != '[]' && needs.check.result != 'failure' &&
      needs.e2e-chromium.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_engines) }}
    uses: ./.github/workflows/e2e-slice.yml # zizmor: ignore[self-repository]
    with:
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      filter: ${{ matrix.filter }}
      shard: ${{ matrix.shard }}
      adapters: ${{ matrix.adapters }}
      browser: ${{ matrix.browser }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # The browser test projects (core, content, machine) in the engines beside Chromium (which `check`
  # runs): Playwright's Firefox and WebKit, and Firefox as released (WebdriverIO and geckodriver:
  # Playwright's Firefox build can lag the release, and #382 showed in the release). They run vitest
  # directly (no turbo task to replay), so they always set up.
  browsers:
    name: browsers (${{ matrix.browser }})
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.browsers != '[]' && needs.check.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        if: matrix.browser != 'firefox-stable'
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        if: matrix.browser != 'firefox-stable'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # WebKit needs system libraries the runner image lacks: --with-deps here
      - name: Install Playwright ${{ matrix.browser }}
        if: matrix.browser != 'firefox-stable'
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps "$BROWSER"

      # the released Firefox (the runner's own is replaced by the latest release); geckodriver is
      # fetched by webdriverio when the run starts
      - name: Install Firefox (release)
        if: matrix.browser == 'firefox-stable'
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest

      - name: Build the libraries
        run: pnpm run build:lib

      - name: Browser tests (core, content, machine)
        run: |
          for pkg in machine content core; do
            echo "::group::$pkg"
            (cd packages/$pkg && pnpm exec vitest run --project 'browser*') || failed=1
            echo "::endgroup::"
          done
          exit ${failed:-0}
        env:
          OGYGIA_BROWSERS: ${{ matrix.browser }}
          OGYGIA_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}

      # remembered: the same inputs in this engine passed (the plan leaves the job out next time)
      - name: Remember the pass
        run: echo "${{ needs.plan.outputs.browsers_hash }}" > .browsers-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .browsers-pass
          key: browsers-pass-${{ matrix.browser }}-${{ needs.plan.outputs.browsers_hash }}

  # The runtime's size against the PR's base branch, both measured here with this PR's tool
  # (apps/palaestra/e2e/bundle-size.ts: per page kind, brotli, as a production browser build ships it).
  # Growth past 0.5 % fails, unless the PR body says why on a line of its own: `Size baseline: <why>`.
  # A PR can no longer raise its own baseline by rewriting a snapshot. Only when core's build changed.
  size:
    needs: plan
    if: ${{ github.event_name == 'pull_request' && needs.plan.outputs.size == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the base branch beside it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .size-base

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # (core's runtime and the compiler's runtime entry that bundles it)
      - name: Install and build core and the compiler (this PR)
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@ogygia/core... --filter=@ogygia/compiler...

      - name: Install and build core and the compiler (the base)
        working-directory: .size-base
        run: |
          pnpm install --frozen-lockfile
          filters=(--filter=@ogygia/core...)
          # (a base from before @ogygia/compiler has the runtime entry inside core)
          if [ -d packages/compiler ]; then filters+=(--filter=@ogygia/compiler...); fi
          pnpm turbo run build "${filters[@]}"

      - name: Measure the base
        run: node apps/palaestra/e2e/bundle-size.ts --core .size-base/packages/core --json > size-base.json

      - name: Measure this PR against it
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if node apps/palaestra/e2e/bundle-size.ts --compare size-base.json; then exit 0; fi
          if printf '%s\n' "$PR_BODY" | grep -q '^Size baseline: .'; then
            echo "Growth accepted by the PR body:"
            printf '%s\n' "$PR_BODY" | grep '^Size baseline: '
            exit 0
          fi
          exit 1

      # remembered: this core build against this base passed (the plan leaves the job out next time)
      - name: Remember the pass
        run: echo "${{ needs.plan.outputs.size_hash }}" > .size-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .size-pass
          key: size-pass-${{ needs.plan.outputs.size_hash }}

  # THE required check: green when every job the plan asked for passed, and jobs it left out on
  # purpose were skipped (a version PR, a push that changes nothing to test, slices whose tasks all
  # replay). Red when any needed job failed or was cancelled. The matrices are dynamic, so no other
  # job name can be required: a name the plan leaves out would wait forever.
  ci-ok:
    name: ci ok
    needs: [plan, check, e2e-chromium, e2e-engines, browsers, size]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A batched PR (ci-stack.ts) skipped its e2e: it lands only through its batch's green run, so
      # its own `ci ok` is never green. Removing the label needs a new push: a rerun keeps the old labels.
      - name: Not a batched PR
        env:
          BATCHED: ${{ needs.plan.outputs.batched }}
        run: |
          if [ "$BATCHED" = true ]; then
            echo "::error::This PR carries \`batched\`: its e2e runs on its ci/integration-* batch, and it lands only through that batch."
            exit 1
          fi

      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            let bad = 0;
            for (const [job, { result }] of Object.entries(needs)) {
              console.log(`${job}: ${result}`);
              if (result === "failure" || result === "cancelled") bad++;
            }
            process.exit(bad ? 1 : 0);
          '
