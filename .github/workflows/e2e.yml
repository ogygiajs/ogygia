name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two kinds of job, side by side on separate runners: `check` (format, lint, every package's check)
# and `e2e`, one runner per slice of the e2e suites. Each suite runs one test at a time on purpose (its
# fixture app's state is shared, and some specs time things), so a bigger runner would sit idle: the
# speedup comes from running the slices AT ONCE, not from cores.

# turbo's remote cache (Vercel, the purus-projects team): every runner, slice and machine shares one
# cache. Without the secret (a fork's PR) turbo falls back to the local cache restored below.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# A new push to a PR cancels that PR's older runs (main, schedules and manual runs never are)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A version PR (changeset-release/*) only bumps versions and changelogs: nothing to check
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Node 22: adapter-vercel rejects unpinned bleeding-edge Node; 22 is a supported runtime.
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # first, and fast: an unformatted file or a lint error fails here, not after the checks
      - name: Format check (oxfmt)
        run: pnpm run format:check

      - name: Lint (oxlint)
        run: pnpm run lint

      # turbo's local cache: a package whose inputs did not change replays its build and check
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-check-
            turbo-${{ runner.os }}-

      # What `check` would run, asked of turbo first: when every check task is a cache hit, nothing
      # runs a browser (a replay only prints the stored logs), so the browser's setup is skipped.
      - name: Plan
        id: plan
        run: |
          pnpm exec turbo run check --filter=./packages/* --filter=./packages/*/e2e/* --filter=./apps/* --dry=json > turbo-plan.json
          node -e '
            const plan = JSON.parse(require("fs").readFileSync("turbo-plan.json", "utf8"));
            const checks = (plan.tasks ?? []).filter((t) => t.task === "check");
            const left = checks.filter((t) => t.cache?.status !== "HIT");
            console.log(`${checks.length} check task(s), ${left.length} to run: ${left.map((t) => t.taskId).join(", ") || "none"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `skip=${left.length === 0}\n`);
          '
        env:
          OGYGIA_BROWSERS: chromium

      # core's vitest has a browser project.
      # Playwright's Chromium, cached per Playwright version: a hit downloads nothing. No `--with-deps`:
      # the runner image already has the browser's system libraries (it ships Google Chrome), and that
      # apt step is what stalled jobs. (Not the runner's Chrome itself: it fetches /favicon.ico on every
      # page, and the 404 trips the suites' "no console errors" checks.)
      - name: Playwright version
        if: steps.plan.outputs.skip != 'true'
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.plan.outputs.skip != 'true'
        run: pnpm exec playwright install chromium

      # Root `check` (build:lib + every package's check, every fixture app's and app's svelte-check
      # with warnings failing, each package's test and e2e tsc) — the e2e suites alone never run it,
      # which let type debt rot invisibly until upstream-watch tripped on it. Two tasks at a time:
      # every package's check runs its own vitest pool (core's with a browser), and turbo's default
      # ten at once on this 4-core runner starved them into timeouts.
      - name: Type-check (build:lib, every package's check)
        run: pnpm run check --concurrency=2
        # (the browser projects in Chromium here; the other engines in the `browsers` jobs, beside it)
        env:
          OGYGIA_BROWSERS: chromium

      # the bench files (packages/*/bench, run by Heisenbench in ogygiajs/bench): their private-function
      # types written from Heisenbench at the ref internal/heisenbench pins, then type-checked like the tests are,
      # against the libraries the step above built
      - name: Type-check the bench files
        run: pnpm run check:bench

  # The browser test projects (core, content, machine) in the engines beside Chromium (which the
  # `check` job runs): Playwright's Firefox and WebKit, and Firefox as released (WebdriverIO and
  # geckodriver: Playwright's Firefox build can lag the release, and #382 showed in the release).
  # One job per engine, at the same time as `check`, so wall time stays about the same. All required.
  # Playwright's WebKit is the engine behind Safari, not Safari itself.
  browsers:
    name: browsers (${{ matrix.browser }})
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, firefox-stable]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-browsers-${{ matrix.browser }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-browsers-${{ matrix.browser }}-
            turbo-${{ runner.os }}-

      - name: Playwright version
        if: matrix.browser != 'firefox-stable'
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        if: matrix.browser != 'firefox-stable'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # WebKit needs system libraries the runner image lacks: --with-deps here
      - name: Install Playwright ${{ matrix.browser }}
        if: matrix.browser != 'firefox-stable'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # the released Firefox (the runner's own is replaced by the latest release); geckodriver is
      # fetched by webdriverio when the run starts
      - name: Install Firefox (release)
        if: matrix.browser == 'firefox-stable'
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Build the libraries
        run: pnpm run build:lib

      - name: Browser tests (core, content, machine)
        run: |
          for pkg in machine content core; do
            echo "::group::$pkg"
            (cd packages/$pkg && pnpm exec vitest run --project browser) || failed=1
            echo "::endgroup::"
          done
          exit ${failed:-0}
        env:
          OGYGIA_BROWSERS: ${{ matrix.browser }}
          OGYGIA_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}

  # The runtime's size against the PR's base branch, both measured here with this PR's tool
  # (apps/palaestra/e2e/bundle-size.ts: per page kind, brotli, as a production browser build ships it).
  # Growth past 0.5 % fails, unless the PR body says why on a line of its own: `Size baseline: <why>`.
  # A PR can no longer raise its own baseline by rewriting a snapshot.
  size:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out the base branch beside it
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .size-base

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build core (this PR)
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@ogygia/core...

      - name: Install and build core (the base)
        working-directory: .size-base
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@ogygia/core...

      - name: Measure the base
        run: node apps/palaestra/e2e/bundle-size.ts --core .size-base/packages/core --json > size-base.json

      - name: Measure this PR against it
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if node apps/palaestra/e2e/bundle-size.ts --compare size-base.json; then exit 0; fi
          if printf '%s\n' "$PR_BODY" | grep -q '^Size baseline: .'; then
            echo "Growth accepted by the PR body:"
            printf '%s\n' "$PR_BODY" | grep '^Size baseline: '
            exit 0
          fi
          exit 1

  e2e:
    # (Chromium's jobs keep their names, `e2e (core 1/3)`…; the other engines add theirs)
    name: e2e (${{ matrix.slice.name }}${{ matrix.browser != 'chromium' && format(', {0}', matrix.browser) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # one red slice must not cancel the others: the whole picture in one run
      fail-fast: false
      matrix:
        # every slice in every engine, side by side: Playwright's WebKit is the engine behind
        # Safari, not Safari itself
        browser: [chromium, firefox, webkit]
        slice:
          # core's suite (apps/palaestra/e2e), the longest, in three Playwright shards (split by spec
          # file); it holds the adapter suite, so bun and wrangler are its alone
          - { name: core 1/3, id: core-1, filter: --filter=palaestra, shard: 1/3, adapters: true }
          - { name: core 2/3, id: core-2, filter: --filter=palaestra, shard: 2/3, adapters: true }
          - { name: core 3/3, id: core-3, filter: --filter=palaestra, shard: 3/3, adapters: true }
          - { name: devtools 1/2, id: devtools-1, filter: --filter=@ogygia/devtools, shard: 1/2 }
          - { name: devtools 2/2, id: devtools-2, filter: --filter=@ogygia/devtools, shard: 2/2 }
          # every other package's suite, one after another; a new suite lands here by itself
          - { name: the rest, id: rest, filter: --filter=!palaestra --filter=!@ogygia/devtools }
    env:
      # A version PR (changeset-release/*) only bumps versions and changelogs: every step skips. (A
      # matrix job skipped as a whole reports one unexpanded name, and the required `e2e (core 1/3)`…
      # checks would wait forever, so the job runs and its steps don't.)
      TEST: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - if: env.TEST == 'true'
        uses: actions/checkout@v7
        with:
          # a pull request runs only the suites its changes reach (`turbo --affected` diffs against
          # the base branch, so it needs the history)
          fetch-depth: 0

      - if: env.TEST == 'true'
        uses: pnpm/action-setup@v6

      - if: env.TEST == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: env.TEST == 'true'
        name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # turbo's local cache, one per slice: a slice whose suite, fixture app and dependencies' builds
      # did not change replays from it
      - if: env.TEST == 'true'
        name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-e2e-${{ matrix.slice.id }}-${{ matrix.browser }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-e2e-${{ matrix.slice.id }}-${{ matrix.browser }}-
            turbo-${{ runner.os }}-

      # What the run below would do, asked of turbo first (`--dry=json`, the same filter, `--affected`
      # and hashed env): when no e2e task is left or every one is a cache hit, nothing runs a browser,
      # bun or workerd (a replay only prints the stored logs), so their setup is skipped. The run step
      # itself always runs, so the logs replay.
      - if: env.TEST == 'true'
        name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then affected=--affected; fi
          pnpm exec turbo run e2e --concurrency=1 ${{ matrix.slice.filter }} $affected --dry=json > turbo-plan.json
          node -e '
            const plan = JSON.parse(require("fs").readFileSync("turbo-plan.json", "utf8"));
            const e2e = (plan.tasks ?? []).filter((t) => t.task === "e2e");
            const left = e2e.filter((t) => t.cache?.status !== "HIT");
            console.log(`${e2e.length} e2e task(s), ${left.length} to run: ${left.map((t) => t.taskId).join(", ") || "none"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `skip=${left.length === 0}\n`);
          '
        env:
          E2E_SHARD: ${{ matrix.slice.shard }}
          OGYGIA_BROWSERS: ${{ matrix.browser }}
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}

      # Bun runtime dimension — the adapter e2e suite runs the node-server output under bun too.
      - if: env.TEST == 'true' && matrix.slice.adapters && steps.plan.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright's Chromium, cached per Playwright version: a hit downloads nothing. No `--with-deps`:
      # the runner image already has the browser's system libraries (it ships Google Chrome), and that
      # apt step is what stalled jobs. (Not the runner's Chrome itself: it fetches /favicon.ico on every
      # page, and the 404 trips the suites' "no console errors" checks.)
      - if: env.TEST == 'true' && steps.plan.outputs.skip != 'true'
        name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - if: env.TEST == 'true' && steps.plan.outputs.skip != 'true'
        name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # (Chromium's system libraries are on the image; WebKit's and Firefox's need --with-deps)
      - if: env.TEST == 'true' && steps.plan.outputs.skip != 'true'
        name: Install Playwright ${{ matrix.browser }}
        run: pnpm exec playwright install ${{ matrix.browser != 'chromium' && '--with-deps' || '' }} ${{ matrix.browser }}

      # wrangler (Cloudflare workerd) is fetched on demand by the suite via npx; warm it so the
      # cloudflare adapter boots the real Workers runtime instead of skipping.
      - if: env.TEST == 'true' && matrix.slice.adapters && steps.plan.outputs.skip != 'true'
        name: Warm wrangler
        run: npx --yes wrangler --version

      # This slice's suites through turbo's `e2e` task (libraries built first, `e2e` depends on
      # `^build`), one suite at a time. A pull request: only if its changes reach them (`--affected`
      # narrows the filter, diffed against the base branch — a core change reaches every suite). A
      # push to main/next, or a manual run: always. `E2E_SHARD` reaches Playwright through the
      # suite config (and turbo hashes it into the `e2e` task, so each shard caches on its own).
      - if: env.TEST == 'true'
        name: Run the e2e suites
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then affected=--affected; fi
          pnpm turbo run e2e --concurrency=1 ${{ matrix.slice.filter }} $affected
        env:
          E2E_SHARD: ${{ matrix.slice.shard }}
          OGYGIA_BROWSERS: ${{ matrix.browser }}
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
          OGYGIA_E2E_WRANGLER: ${{ matrix.slice.adapters && '1' || '' }}
          # Stable CI-only signing key so the warn-path probe's production build is silent (locally
          # this comes from apps/palaestra/.env, which is gitignored). NOT a production secret —
          # the Vercel deploy sets its own OGYGIA_SECRET.
          OGYGIA_SECRET: 3f9a2b7c1e5d8046af62c93b1d7e4058a6c2f19b3e8d70425c9a1f6b8d3e07c4

      # Traces (retained on failure) + the html report, for a red run.
      - if: env.TEST == 'true' && failure()
        name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.slice.id }}-${{ matrix.browser }}
          path: |
            **/playwright-report/
            **/test-results/
            !**/node_modules/**
          retention-days: 7
