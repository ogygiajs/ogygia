name: heisenbench

# Asks ogygiajs/bench for a Heisenbench run the moment a PR is opened or pushed: Heisenbench counts the steps of
# the bench files (packages/*/bench) on the PR's commit and on its base, from source, so it needs no
# pkg.pr.new preview and does not wait for one (pkg-pr-new.yml asks for the app benchmark once the
# preview is published). Heisenbench's section comes first in the PR's one benchmark comment.
#
# A push to main needs nothing here: the `ogygia-main` request pkg-pr-new.yml sends after the
# publish runs Heisenbench over every bench file too. Forks, drafts and version PRs are skipped, like the
# app benchmark. The request never fails: without BENCH_TOKEN it skips with a notice, and a refused
# request only warns.
#
# The `unmeasured` job runs here, in this repository: it fails a PR that adds a function nothing
# measures (see the job).

#
# A PR runs these when it carries or earns `ci:bench` (or `ci:full`, .github/scripts/ci-labels.ts): a
# PR into main earns it, and so does a change to a bench or a hot path. Adding the label starts them.

on:
  pull_request:
    # ready_for_review: a draft gets no run, so one starts when it leaves draft
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # only when runtime or bench code changed: what Heisenbench counts and the gate reads
    paths:
      - 'packages/*/src/**'
      - 'packages/*/bench/**'
      - 'packages/*/test/**'
      - 'internal/heisenbench/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/heisenbench.yml'

permissions: {}

# A new push to a PR cancels that PR's older runs (adding another label does not)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

# The tests these jobs record run their browser projects in Chromium only (the engine this workflow
# installs); the other engines run in e2e.yml's `browsers` jobs.
env:
  OGYGIA_BROWSERS: chromium

jobs:
  # Whether this PR runs them: it carries or earns `ci:bench` (a label event for any other label
  # starts nothing). The version PR runs none.
  gate:
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') && (github.event.action != 'labeled' ||
      github.event.label.name == 'ci:bench' || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if node .github/scripts/ci-labels.ts --has ci:bench; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  request:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'chore/comments-') &&
      github.head_ref != 'chore/structured-comments' &&
      !startsWith(github.head_ref, 'research/') &&
      (contains(github.event.pull_request.labels.*.name, 'ci:bench') ||
      contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # (comment sweeps and research branches change no measured code: no run in the shared pool; and
      # ogygiajs/bench shares the org's runners, so only a PR CARRYING `ci:bench` or `ci:full` asks)
      - name: Request a Heisenbench run
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BENCH_TOKEN is not set, so no Heisenbench run was requested"
            exit 0
          fi
          gh api repos/ogygiajs/bench/dispatches -f event_type=ogygia-heisenbench \
            -F "client_payload[pr]=$PR" -f "client_payload[sha]=$HEAD_SHA" \
            -f "client_payload[base_sha]=$BASE_SHA" ||
            echo "::warning::ogygiajs/bench refused the Heisenbench request (check BENCH_TOKEN)"

  # The measurement-source gate (internal/heisenbench/src/unmeasured.ts): every function in
  # packages/<pkg>/src needs a bench file that runs it or a unit test whose inputs replay. Fails only
  # on functions this PR adds with neither (and no exemption in internal/heisenbench/unmeasured.json);
  # what was unmeasured before is listed in the job summary, not failed.
  unmeasured:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # (runs on pull requests only: it reads the cache and never writes it)
      TURBO_REMOTE_CACHE_READ_ONLY: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the base commit's source is read from git
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Heisenbench needs Node 26.4+; ogygia itself is still tested on 22 everywhere else
          node-version: 26
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # some unit tests import the built libraries
      - name: Build the libraries
        run: pnpm run build:lib

      - name: Functions with no measurement source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          node internal/heisenbench/src/unmeasured.ts --base "$base"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heisenbench-unmeasured
          path: |
            .heisenbench/unmeasured/gate.md
            .heisenbench/unmeasured/gate.json
            .heisenbench/unmeasured/replay.json
          if-no-files-found: ignore
