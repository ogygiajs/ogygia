name: heisenbench

# Asks ogygiajs/bench for a Heisenbench run the moment a PR is opened or pushed: Heisenbench counts the steps of
# the bench files (packages/*/bench) on the PR's commit and on its base, from source, so it needs no
# pkg.pr.new preview and does not wait for one (pkg-pr-new.yml asks for the app benchmark once the
# preview is published). Heisenbench's section comes first in the PR's one benchmark comment.
#
# A push to main needs nothing here: the `ogygia-main` request pkg-pr-new.yml sends after the
# publish runs Heisenbench over every bench file too. Forks, drafts and version PRs are skipped, like the
# app benchmark. The request never fails: without BENCH_TOKEN it skips with a notice, and a refused
# request only warns.
#
# The `unmeasured` job runs here, in this repository: it fails a PR that adds a function nothing
# measures (see the job).

on:
  pull_request:
    # ready_for_review: a draft gets no run, so one starts when it leaves draft
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# The tests these jobs record run their browser projects in Chromium only (the engine this workflow
# installs); the other engines run in e2e.yml's `browsers` jobs.
env:
  OGYGIA_BROWSERS: chromium

jobs:
  request:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a Heisenbench run
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BENCH_TOKEN is not set, so no Heisenbench run was requested"
            exit 0
          fi
          gh api repos/ogygiajs/bench/dispatches -f event_type=ogygia-heisenbench \
            -F "client_payload[pr]=$PR" -f "client_payload[sha]=$HEAD_SHA" \
            -f "client_payload[base_sha]=$BASE_SHA" ||
            echo "::warning::ogygiajs/bench refused the Heisenbench request (check BENCH_TOKEN)"

  # The measurement-source gate (internal/heisenbench/src/unmeasured.ts): every function in
  # packages/<pkg>/src needs a bench file that runs it or a unit test whose inputs replay. Fails only
  # on functions this PR adds with neither (and no exemption in internal/heisenbench/unmeasured.json);
  # what was unmeasured before is listed in the job summary, not failed.
  unmeasured:
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the base commit's source is read from git
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Heisenbench needs Node 26.4+; ogygia itself is still tested on 22 everywhere else
          node-version: 26
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-unmeasured-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-check-
            turbo-${{ runner.os }}-

      # some unit tests import the built libraries
      - name: Build the libraries
        run: pnpm run build:lib

      - name: Functions with no measurement source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          node internal/heisenbench/src/unmeasured.ts --base "$base"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heisenbench-unmeasured
          path: |
            .heisenbench/unmeasured/gate.md
            .heisenbench/unmeasured/gate.json
            .heisenbench/unmeasured/replay.json
          if-no-files-found: ignore
