name: ci labels

# Adds the `ci:*` labels a pull request earns as it is opened and pushed (.github/scripts/ci-labels.ts):
# `ci:bench` and `ci:preview` into main, `ci:engines` for the runtime, router, morph, hydration or
# restore, `ci:bench` for a bench or a hot path. It only adds; a label is the PR's to remove. The
# workflows those labels drive read the same answer for themselves, so this run racing them changes
# nothing: the labels are for people to see, and to keep for later pushes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Add the labels this PR earns
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/ci-labels.ts --apply
