name: mfe built

# THE FEDERATION SUITE ON PRODUCTION BUILDS: examples/mfe's shell, cms and dash each built
# (`vite build`, rules on) and served from their adapter-node builds, then @ogygia/federation's e2e
# specs in Chromium (`OGYGIA_MFE_BUILD=1`, packages/federation/e2e/mfe.ts). The e2e job runs them on
# dev servers, which turn every runtime feature on, so a feature a production build leaves out is
# only seen here (#909). One job. It runs on a push to main, every night, on a manual run, and on a
# pull request that carries or earns `ci:full` (.github/scripts/ci-labels.ts). It reports and does
# not block.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

# (a pull request reads the cache and never writes it: only main's runs fill it)
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name != 'push' }}

# (a push cancels the PR's older run; adding another label does not)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: read

jobs:
  e2e:
    name: federation e2e (built)
    # (a label event for any other label starts nothing; the version PR runs none)
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') && (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:full') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:full'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build the libraries the apps use
        run: pnpm turbo run build --filter=mfe-shell^... --filter=mfe-cms^... --filter=mfe-dash^...

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium

      - name: Build the apps and run the specs
        run: pnpm --filter @ogygia/federation run e2e:built
        env:
          OGYGIA_BROWSERS: chromium

      - if: failure()
        name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-federation-built
          path: packages/federation/playwright-report/
