name: e2e slice

# One slice of the e2e suites in one engine, called by e2e.yml's `e2e` jobs with the slice the plan
# chose. Each suite runs one test at a time on purpose (its fixture app's state is shared, and some
# specs time things), so a bigger runner would sit idle: the speedup comes from running the slices at
# once, not from cores.

on:
  workflow_call:
    inputs:
      name: { type: string, required: true }
      id: { type: string, required: true }
      filter: { type: string, required: true }
      shard: { type: string, required: false, default: '' }
      adapters: { type: boolean, required: false, default: false }
      browser: { type: string, required: true }
    secrets:
      TURBO_TOKEN: { required: false }
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: { required: false }

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # (the caller's event: a pull request reads the cache and never writes it)
      TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # a pull request runs only the suites its changes reach (`turbo --affected` diffs against
          # the base branch, so it needs the history)
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # What the run below would do, asked of turbo first (`--dry=json`, the same filter, `--affected`
      # and hashed env): when no e2e task is left or every one is a cache hit (a rerun, say), nothing
      # runs a browser, bun or workerd (a replay only prints the stored logs), so their setup is
      # skipped. The run step itself always runs, so the logs replay.
      - name: Plan
        id: plan
        run: |
          if [ "$EVENT" = "pull_request" ]; then affected=--affected; fi
          # (word-split on purpose: the filter is several --filter flags)
          pnpm exec turbo run e2e --concurrency=1 $FILTER $affected --dry=json > turbo-plan.json
          node -e '
            const plan = JSON.parse(require("fs").readFileSync("turbo-plan.json", "utf8"));
            const e2e = (plan.tasks ?? []).filter((t) => t.task === "e2e" && t.command !== "<NONEXISTENT>");
            const left = e2e.filter((t) => t.cache?.status !== "HIT");
            console.log(`${e2e.length} e2e task(s), ${left.length} to run: ${left.map((t) => t.taskId).join(", ") || "none"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `skip=${left.length === 0}\n`);
          '
        env:
          EVENT: ${{ github.event_name }}
          FILTER: ${{ inputs.filter }}
          E2E_SHARD: ${{ inputs.shard }}
          OGYGIA_BROWSERS: ${{ inputs.browser }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}

      # Bun runtime dimension — the adapter e2e suite runs the node-server output under bun too.
      - if: inputs.adapters && steps.plan.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Playwright's browser, cached per engine and Playwright version: a hit downloads nothing.
      # Chromium needs no `--with-deps` (the runner image has its system libraries; that apt step is
      # what stalled jobs). Firefox and WebKit need theirs.
      - if: steps.plan.outputs.skip != 'true'
        name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.skip != 'true'
        name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ steps.playwright.outputs.version }}

      - if: steps.plan.outputs.skip != 'true'
        name: Install Playwright ${{ inputs.browser }}
        env:
          BROWSER: ${{ inputs.browser }}
        run: |
          if [ "$BROWSER" = chromium ]; then deps=; else deps=--with-deps; fi
          pnpm exec playwright install $deps "$BROWSER"

      # wrangler (Cloudflare workerd) is fetched on demand by the suite via npx; warm it so the
      # cloudflare adapter boots the real Workers runtime instead of skipping.
      - if: inputs.adapters && steps.plan.outputs.skip != 'true'
        name: Warm wrangler
        run: npx --yes wrangler --version

      # This slice's suites through turbo's `e2e` task (libraries built first, `e2e` depends on
      # `^build`), one suite at a time. A pull request: only if its changes reach them (`--affected`).
      # A push to main or a manual run: always. `E2E_SHARD` and `OGYGIA_BROWSERS` reach Playwright
      # through the suite config, and turbo hashes both into the `e2e` task.
      - name: Run the e2e suites
        run: |
          if [ "$EVENT" = "pull_request" ]; then affected=--affected; fi
          pnpm turbo run e2e --concurrency=1 $FILTER $affected
        env:
          EVENT: ${{ github.event_name }}
          FILTER: ${{ inputs.filter }}
          E2E_SHARD: ${{ inputs.shard }}
          OGYGIA_BROWSERS: ${{ inputs.browser }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          OGYGIA_E2E_WRANGLER: ${{ inputs.adapters && '1' || '' }}
          # Stable CI-only signing key so the warn-path probe's production build is silent (locally
          # this comes from apps/palaestra/.env, which is gitignored). NOT a production secret —
          # the Vercel deploy sets its own OGYGIA_SECRET.
          OGYGIA_SECRET: 3f9a2b7c1e5d8046af62c93b1d7e4058a6c2f19b3e8d70425c9a1f6b8d3e07c4

      # Traces (retained on failure) + the html report, for a red run. Gathered by `find` (it skips
      # node_modules and follows no links) into one folder the upload takes whole: the upload's own
      # `**` glob walked pnpm's links through every node_modules, and a red run sat in it until the
      # job's 30 minutes ran out.
      - if: failure()
        name: Gather the Playwright report
        run: |
          find . -name node_modules -prune -o -name .git -prune -o -type d \
            \( -name playwright-report -o -name test-results \) -print > e2e-report.txt
          while read -r d; do mkdir -p "e2e-report/$d" && cp -R "$d/." "e2e-report/$d/"; done < e2e-report.txt

      - if: failure()
        name: Upload Playwright report
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ inputs.id }}-${{ inputs.browser }}
          path: e2e-report/
          if-no-files-found: ignore
          retention-days: 7

      # On main: each suite's Playwright JSON (one per engine and shard), for the tests report
      # (.github/scripts/test-report.ts reads them; .github/workflows/tests-report.yml gathers them).
      # Gathered the same way, for the same reason.
      - if: always() && github.event_name != 'pull_request'
        name: Gather the e2e results
        run: |
          find . -name node_modules -prune -o -name .git -prune -o -type f \
            -path '*/playwright-results/*.json' -print > e2e-results.txt
          while read -r f; do mkdir -p "e2e-results/$(dirname "$f")" && cp "$f" "e2e-results/$f"; done < e2e-results.txt

      - if: always() && github.event_name != 'pull_request'
        name: Upload the e2e results
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ inputs.id }}-${{ inputs.browser }}
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 30
