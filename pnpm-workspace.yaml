packages:
  - 'packages/*'
  # each package's e2e fixture app (packages/<name>/e2e/app) and the packages a fixture app installs
  - 'packages/*/e2e/*'
  - 'apps/*'
  # Non-library projects (talk deck, internal checks, repros) — workspace members so they share
  # the root install instead of each spawning its own node_modules.
  - 'internal/*'
  # the app header lab is NOT a workspace member: gitignored, installs standalone (no lockfile importer)
  - '!internal/repro-header-lab'
  - '!internal/repro-catalog'
  - '!internal/repro-ogygia-footer'
  # Runnable demos (the MFE federation trio + contracts) — consume the live packages/ogygia (over packages/core).
  - 'examples/mfe/*'
allowBuilds:
  # A transitive dep of sass-embedded (a devDependency, for compiling `<style lang="scss">` in tests).
  # Its native watcher build is not needed — sass compileString works without it — and CI's
  # `--frozen-lockfile` errors on an unlisted build script, so deny it explicitly.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
# ONE version per dependency that more than one workspace package uses: `"x": "catalog:"`.
# `pnpm publish` writes the real range into the published package.json.
catalog:
  # svelte + kit (SvelteKit 3 only). Svelte stays on 5.57.2: 5.57.3's branded `Snippet` rejects
  # svelte-check's type for a snippet declared inside `{#each}` (upstream; #126).
  svelte: 5.57.2
  '@sveltejs/kit': ^3.1.1
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@sveltejs/adapter-node': ^6.0.1
  '@sveltejs/adapter-vercel': ^7.0.2
  svelte-check: ^4.7.4
  svelte2tsx: ^0.7.60
  # build
  vite: ^8.3.5
  rolldown: ^1.2.2
  '@rolldown/browser': 1.2.2
  tsdown: ^0.23.4
  typescript: ^6.0.3
  '@types/node': ^26.1.2
  vite-plugin-wasm: ^3.6.0
  path-browserify: ^1.0.1
  magic-string: ^1.4.5
  # test
  vitest: ^4.1.12
  '@playwright/test': 1.62.1
  playwright: ^1.62.1
  axe-core: ^4.13.0
  # runtime
  devalue: ^5.9.3
  esm-env: ^1.2.2
  valibot: ^1.4.2
  # content
  mdsvex: ^0.12.8
  shiki: ^4.4.1
  mdast-util-from-markdown: ^2.0.2
  # ui
  bits-ui: ^2.18.1
  '@neodrag/svelte': 3.0.0-next.12
  '@codemirror/commands': ^6.11.0
  '@codemirror/lang-html': ^6.4.12
  '@codemirror/lang-javascript': ^6.2.5
  '@codemirror/state': ^6.7.1
  '@codemirror/view': ^6.43.9
catalogs:
  # What an APP may have, for the published packages' peerDependencies: `"x": "catalog:peers"`.
  # Wider than what we test with (the default catalog), on purpose.
  peers:
    '@playwright/test': ^1.62.0
    '@sveltejs/kit': ^3.0.0
    playwright: ^1.62.0
    rolldown: '>=1.0.0'
    shiki: ^3.0.0 || ^4.0.0
    svelte: ^5.57.1
    vite: ^8.2.4
  # TypeScript 7 (the native compiler): the root's, and `@typescript/native` beside TypeScript 6 in
  # every package and app that runs `tsc` (its `tsc` bin wins the name, so `tsc -p …` is 7), while
  # svelte-check and the libraries' d.ts emit load the `typescript` module, 6 (svelte-check's peer
  # range stops at 6).
  tsgo:
    typescript: ^7.0.2
    '@typescript/native': npm:typescript@^7.0.2
  # internal/repro: the CONTROL repro (plain Svelte on Vite 6, no ogygia), frozen at the versions its
  # measurements were taken on (vite on the 6.4 patch line for its security fixes).
  repro-control:
    vite: 6.4.5
    '@sveltejs/vite-plugin-svelte': 5.1.1
    svelte: 5.56.8
# Not a workspace member, so no catalog reaches it; its pins stay inline, on purpose: the adapter
# fixture (apps/palaestra/e2e/adapters/fixture).
# The docs read only geist's font FILES (apps/docs/scripts/subset-fonts.ts); its `next` peer is for
# the Next.js helpers we never import, so it stays optional instead of auto-installing Next + React.
packageExtensions:
  geist:
    peerDependenciesMeta:
      next:
        optional: true
# Security fixes a dependency's own range would not take (same API, checked): satori pins
# fflate 0.7.3 exactly (the fix is the 0.7.5 patch), vite-plugin-top-level-await pins uuid 10.
overrides:
  'satori>fflate': ^0.7.5
  'vite-plugin-top-level-await>uuid': ^11.1.1
minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm64@1.2.2'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.2'
  - '@rolldown/binding-linux-arm64-musl@1.2.2'
