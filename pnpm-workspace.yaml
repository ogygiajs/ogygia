packages:
  - 'packages/*'
  # each package's e2e fixture app (packages/<name>/e2e/app) and the packages a fixture app installs
  - 'packages/*/e2e/*'
  - 'apps/*'
  # Non-library projects (talk deck, internal checks, repros) — workspace members so they share
  # the root install instead of each spawning its own node_modules.
  - 'internal/*'
  # the app header lab is NOT a workspace member: gitignored, installs standalone (no lockfile importer)
  - '!internal/repro-header-lab'
  - '!internal/repro-catalog'
  - '!internal/repro-ogygia-footer'
  # the SvelteKit 3 app installs the PACKED ogygia standalone (e2e/kit3.spec.ts): a workspace link
  # would resolve ogygia's own Kit 2 dev install next to the app's Kit 3
  - '!internal/repro-kit3'
  # Runnable demos (the MFE federation trio + contracts) — consume the live packages/ogygia (over packages/core).
  - 'examples/mfe/*'
allowBuilds:
  # A transitive dep of sass-embedded (a devDependency, for compiling `<style lang="scss">` in tests).
  # Its native watcher build is not needed — sass compileString works without it — and CI's
  # `--frozen-lockfile` errors on an unlisted build script, so deny it explicitly.
  '@parcel/watcher': false
  # webdriverio's drivers: Edge is never driven, and geckodriver is fetched by webdriverio when a
  # run starts (its install script is not needed)
  edgedriver: false
  geckodriver: false
  '@swc/core': true
  esbuild: true
# ONE version per dependency that more than one workspace package uses: `"x": "catalog:"`.
# `pnpm publish` writes the real range into the published package.json.
catalog:
  # svelte + kit
  svelte: 5.57.3
  '@sveltejs/kit': ^2.70.2
  '@sveltejs/vite-plugin-svelte': ^7.2.0
  '@sveltejs/adapter-node': ^5.5.7
  '@sveltejs/adapter-vercel': ^6.3.4
  svelte-check: ^4.7.4
  svelte2tsx: ^0.7.60
  # build
  vite: ^8.3.5
  rolldown: ^1.2.2
  tsdown: ^0.23.4
  typescript: ^6.0.3
  '@types/node': ^26.1.2
  magic-string: ^1.4.5
  '@jridgewell/remapping': ^2.3.5
  '@jridgewell/trace-mapping': ^0.3.31
  # test
  vitest: ^4.1.12
  '@vitest/browser': 4.1.12
  '@vitest/browser-playwright': 4.1.12
  # coverage for every package's unit and browser projects (.github/scripts/coverage.ts)
  '@vitest/coverage-v8': 4.1.12
  # the released Firefox for the browser projects (through geckodriver)
  '@vitest/browser-webdriverio': 4.1.12
  # 9, not 10: vitest 4.1's webdriverio provider calls `switchFrame`, which 10 removed for BiDi sessions
  webdriverio: 9.32.0
  '@playwright/test': 1.62.1
  playwright: ^1.62.1
  axe-core: ^4.13.0
  fast-check: ^4.10.2
  # the spec HTML parser the differential tests compare ogygia's own HTML readers against
  parse5: ~8.0.1
  # runtime
  devalue: ^5.9.3
  esm-env: ^1.2.2
  valibot: ^1.4.2
  # content
  mdsvex: ^0.12.8
  shiki: ^4.4.1
  mdast-util-from-markdown: ^2.0.2
  # ui
  bits-ui: ^2.18.1
  '@neodrag/svelte': 3.0.0-next.12
  '@codemirror/commands': ^6.11.0
  '@codemirror/lang-html': ^6.4.12
  '@codemirror/lang-javascript': ^6.2.5
  '@codemirror/state': ^6.7.1
  '@codemirror/view': ^6.43.9
catalogs:
  # What an APP may have, for the published packages' peerDependencies: `"x": "catalog:peers"`.
  # Wider than what we test with (the default catalog), on purpose.
  peers:
    '@playwright/test': ^1.62.0
    '@sveltejs/kit': '>=2.70.2 <4'
    playwright: ^1.62.0
    rolldown: '>=1.0.0'
    shiki: ^3.0.0 || ^4.0.0
    svelte: ^5.56.8
    vite: ^8.2.4
  # TypeScript 7 (the native compiler): the root's, and `@typescript/native` beside TypeScript 6 in
  # every package and app that runs `tsc` (its `tsc` bin wins the name, so `tsc -p …` is 7), while
  # svelte-check and the libraries' d.ts emit load the `typescript` module, 6 (svelte-check's peer
  # range stops at 6).
  tsgo:
    typescript: ^7.0.2
    '@typescript/native': npm:typescript@^7.0.2
  # Kit 3, read by core's kit-shim-surface test (internal/kit-sources), and the svelte its peers ask
  # for: its own importer, so they never move the versions ogygia and the apps resolve.
  kit3:
    '@sveltejs/kit3': npm:@sveltejs/kit@3.0.1
    svelte: 5.57.2
  # internal/repro: the CONTROL repro (plain Svelte on Vite 6, no ogygia), frozen at the versions its
  # measurements were taken on (vite on the 6.4 patch line for its security fixes).
  repro-control:
    vite: 6.4.5
    '@sveltejs/vite-plugin-svelte': 5.1.1
    svelte: 5.56.8
  # internal/sim: happy-dom pinned exactly. The simulator replaces its module compile step and reads
  # its history and console internals (internal/notes/dst.md), so a new version is a deliberate move.
  sim:
    happy-dom: 21.0.4
    # the HTML quality oracle's spec parser (its parse errors are the spec's): the version already in
    # the tree
    parse5: 7.3.0
# Not workspace members, so no catalog reaches them; their pins stay inline, on purpose: the adapter
# fixture (apps/palaestra/e2e/adapters/fixture) and the Kit 3 app (internal/repro-kit3, installs the
# packed ogygia).
# The docs read only geist's font FILES (apps/docs/scripts/subset-fonts.ts); its `next` peer is for
# the Next.js helpers we never import, so it stays optional instead of auto-installing Next + React.
packageExtensions:
  geist:
    peerDependenciesMeta:
      next:
        optional: true
# Security fixes a dependency's own range would not take (same API, checked): satori pins
# fflate 0.7.3 exactly (the fix is the 0.7.5 patch), vite-plugin-top-level-await pins uuid 10.
overrides:
  'satori>fflate': ^0.7.5
  'vite-plugin-top-level-await>uuid': ^11.1.1
minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm64@1.2.2'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.2'
  - '@rolldown/binding-linux-arm64-musl@1.2.2'
